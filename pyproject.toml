[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "remit-mcp"
version = "0.1.8"
description = "MCP server for Kenya diaspora remittance optimization"
readme = "README.md"
license = "MIT"
authors = [{ name = "Gabriel Mahia", email = "contact@aikungfu.dev" }]
keywords = ["mcp", "remittance", "kenya", "diaspora", "fintech", "east-africa"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Office/Business :: Financial",
]
requires-python = ">=3.10"
dependencies = ["fastmcp>=0.9", "requests>=2.31"]
license-files = ["LICENSE"]

[project.scripts]
remit-mcp = "remit_mcp.server:main"

[project.urls]
Homepage = "https://github.com/gabrielmahia/remit-mcp"
Repository = "https://github.com/gabrielmahia/remit-mcp"
Documentation = "https://github.com/gabrielmahia/nairobi-stack"
"MCP Registry" = "https://registry.modelcontextprotocol.io"
Datasets = "https://huggingface.co/gmahia"
Evaluation = "https://github.com/gabrielmahia/kipimo"

[tool.setuptools.packages.find]
where = ["src"]
